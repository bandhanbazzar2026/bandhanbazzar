<!DOCTYPE html>
<html lang="hi">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Bandhan Bazaar - Visitor Registration</title>

      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
      <link rel="stylesheet" href="style.css">

      <!-- QR Code Library -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
      <!-- jsPDF Library for PDF Generation -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

      <style>
            /* Modal Overlay & Card Styling */
            .modal-overlay {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  background: rgba(0, 0, 0, 0.7);
                  display: none;
                  align-items: center;
                  justify-content: center;
                  z-index: 9999;
                  padding: 20px;
                  box-sizing: border-box;
            }

            .modal-card {
                  background: #ffffff;
                  border-radius: 16px;
                  max-width: 420px;
                  width: 100%;
                  padding: 30px 24px;
                  text-align: center;
                  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                  animation: popupAnim 0.3s ease-out forwards;
                  font-family: 'Poppins', sans-serif;
            }

            @keyframes popupAnim {
                  from {
                        transform: scale(0.8);
                        opacity: 0;
                  }

                  to {
                        transform: scale(1);
                        opacity: 1;
                  }
            }

            .modal-icon {
                  width: 65px;
                  height: 65px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 32px;
                  margin: 0 auto 16px auto;
            }

            /* Registration Closed Custom Styling */
            .modal-icon-closed {
                  background: #FEE2E2;
                  color: #DC2626;
            }

            .modal-title {
                  font-size: 22px;
                  font-weight: 700;
                  color: #1E293B;
                  margin-bottom: 8px;
            }

            .modal-desc {
                  font-size: 14px;
                  color: #64748B;
                  margin-bottom: 24px;
                  line-height: 1.5;
            }

            .btn-modal-redirect {
                  width: 100%;
                  background: #F97316;
                  color: #ffffff;
                  border: none;
                  padding: 14px 20px;
                  font-size: 16px;
                  font-weight: 600;
                  border-radius: 8px;
                  cursor: pointer;
                  transition: background 0.2s ease;
            }

            .btn-modal-redirect:hover {
                  background: #EA580C;
            }

            /* Disabled state button style */
            .btn-submit:disabled {
                  background: #94A3B8 !important;
                  cursor: not-allowed;
            }
      </style>
</head>

<body>

      <!-- Main Layout Wrapper -->
      <div class="main-container">

            <!-- Left Sponsor Sidebar -->
            <aside class="sponsor-sidebar sponsor-left">
                  <div class="sponsor-main-title">OUR SPONSORS</div>

                  <div class="sponsor-sections-grid">
                        <div class="sponsor-section">
                              <span class="sponsor-tag">POWERED BY</span>
                              <div class="sponsor-card">
                                    <img src="assets/1 BCM.png" alt="Powered By Sponsor"
                                          onerror="this.src='https://via.placeholder.com/250x150?text=Powered+By'">
                              </div>
                        </div>

                        <div class="sponsor-section">
                              <span class="sponsor-tag">CO-POWERED BY</span>
                              <div class="sponsor-card">
                                    <img src="assets/2 MAHENDRA KUMAR MOOLCHAND & SONS.png" alt="Co-Powered By Sponsor"
                                          onerror="this.src='https://via.placeholder.com/250x150?text=Co-Powered+By'">
                              </div>
                        </div>
                  </div>
            </aside>

            <!-- Central Form Card -->
            <div class="form-card">
                  <div class="form-header">
                        <img src="assets/headerlogo.png" alt="Bandhan Bazaar Header Logo" class="header-logo">
                  </div>

                  <form id="visitorForm">
                        <div class="form-group">
                              <label for="name">Name (Aapka Naam) *</label>
                              <input type="text" id="name" disabled placeholder="Registration closed">
                        </div>

                        <div class="form-group">
                              <label for="fatherName">Father's Name *</label>
                              <input type="text" id="fatherName" disabled placeholder="Registration closed">
                        </div>

                        <div class="form-group">
                              <label for="address">Address *</label>
                              <textarea id="address" rows="2" disabled placeholder="Registration closed"></textarea>
                        </div>

                        <div class="form-group">
                              <label for="mobile">Mobile No *</label>
                              <input type="tel" id="mobile" pattern="[0-9]{10}" disabled placeholder="Registration closed">
                        </div>

                        <div class="form-group">
                              <label for="numMembers">Number of Members (Maximum 5 member only)</label>
                              <input type="number" id="numMembers" min="0" max="5" value="0" disabled>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-submit" disabled>Registration Closed</button>
                        <div id="statusMsg" class="status-msg"></div>
                  </form>
            </div>

            <!-- Right Sponsor Sidebar -->
            <aside class="sponsor-sidebar sponsor-right">
                  <div class="sponsor-main-title">OUR SPONSORS</div>
                  <span class="sponsor-tag">ASSOCIATED WITH</span>

                  <div class="sponsor-cards-grid">
                        <div class="sponsor-card">
                              <img src="assets/8 BALAJI WATER BOTTLES.png" alt="Associated Sponsor 1"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+2'">
                        </div>
                        <div class="sponsor-card">
                              <img src="assets/4  ID CARD FACTORY.png" alt="Associated Sponsor 2"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/10 MD PROPERTIES.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/9 ASHOK GROUP.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/3 MERTIA SWEET.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/6 GANPATI SOUND AND LIGHT.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/7 WEDDING COLOURS.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/5 LITTLE SKETCHERS.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/11 Mateshwari Publicity.png" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>

                        <div class="sponsor-card">
                              <img src="assets/12 Maa Kripa.jpeg" alt="Associated Sponsor 3"
                                    onerror="this.src='https://via.placeholder.com/250x150?text=Sponsor+4'">
                        </div>
                  </div>
            </aside>

      </div>

      <!-- Registration Closed Modal -->
      <div id="closedModal" class="modal-overlay">
            <div class="modal-card">
                  <div class="modal-icon modal-icon-closed">✕</div>
                  <div class="modal-title">Registration Closed!</div>
                  <div class="modal-desc">Bandhan Bazaar 2026 ke liye visitor registrations ab band ho chuke hain. Aapka sahyog dene ke liye dhanyawad!</div>
                  <button id="redirectBtn" class="btn-modal-redirect">Go to Main Website</button>
            </div>
      </div>

      <!-- Script for Registration Closed Handler -->
      <script>
            document.addEventListener('DOMContentLoaded', () => {
                  const closedModal = document.getElementById('closedModal');
                  const redirectBtn = document.getElementById('redirectBtn');
                  const form = document.getElementById('visitorForm');

                  // Show modal automatically on page load
                  closedModal.style.display = "flex";

                  // Show modal if form/button is clicked
                  form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        closedModal.style.display = "flex";
                  });

                  // Redirect to main website
                  redirectBtn.addEventListener('click', () => {
                        window.location.href = "https://bandhanbazaar.in/";
                  });
            });
      </script>
</body>

</html>
